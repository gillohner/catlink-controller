# Replace paths with absolute paths belonging to your service user.
# Listening on all interfaces is acceptable only when the host firewall restricts
# the port to the hotspot and (optionally) the home LAN; otherwise bind 10.42.0.1.
listen-http: ":18081"
base-url: "http://LAPTOP_LAN_IP:18081"
auth-file: "/ABSOLUTE/PRIVATE/STATE/ntfy-auth.db"
auth-default-access: "deny-all"
cache-file: "/ABSOLUTE/PRIVATE/STATE/ntfy-cache.db"
cache-duration: "24h"
enable-signup: false
enable-login: true
# The bridge, health and label services all poll from localhost; without this they
# share one visitor rate limit and get HTTP 429.
visitor-request-limit-exempt-hosts: "127.0.0.1"
attachment-cache-dir: "/ABSOLUTE/PRIVATE/STATE/ntfy-attachments"
attachment-expiry-duration: "72h"
