[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catlink-local-controller"
version = "0.0.1"
description = "Experimental local CATLINK C08 protocol implementation"
requires-python = ">=3.11"

[project.scripts]
catlink-local = "catlink_local.server:main"
catlink-ctl = "catlink_local.client:main"
catlink-notify = "catlink_local.notify:main"
catlink-push = "catlink_local.push:main"
catlink-pcap-frames = "catlink_local.pcap_frames:main"

[tool.setuptools.packages.find]
where = ["src"]
